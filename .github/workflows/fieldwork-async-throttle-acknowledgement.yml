name: Fieldwork async throttle acknowledgement

# Candidate under test: 02fc79ee3ca4597c667d16bfa955b9af4da68c5c
on:
  pull_request:
    branches:
      - fix/async-throttle-shared-acknowledgement

permissions:
  contents: read

concurrency:
  group: fieldwork-async-throttle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact candidate base
        run: test "$(git rev-parse HEAD^1)" = "02fc79ee3ca4597c667d16bfa955b9af4da68c5c"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check candidate formatting
        run: >-
          pnpm exec prettier --check
          packages/query-async-storage-persister/src/asyncThrottle.ts
          packages/query-async-storage-persister/src/__tests__/asyncThrottle.test.ts
          packages/query-async-storage-persister/src/__tests__/asyncThrottleAcknowledgement.test.ts
          .changeset/fuzzy-rivers-wait.md
      - name: Run focused package tests
        run: >-
          pnpm --filter @tanstack/query-async-storage-persister test:lib --run
          src/__tests__/asyncThrottle.test.ts
          src/__tests__/asyncThrottleAcknowledgement.test.ts
      - name: Run package lint
        run: pnpm --filter @tanstack/query-async-storage-persister test:eslint
      - name: Run current TypeScript check
        run: pnpm --filter @tanstack/query-async-storage-persister test:types:tscurrent
